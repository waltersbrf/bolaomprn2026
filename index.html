            ${res && res.stats ? `<button class="btn-sm btn-azul" onclick="toggleJogoPanel('estats-${g.id}',this)">📊 Stats</button>` : ''}
            <button class="btn-sm btn-amarelo" onclick="togglePalpites(${g.id})">🎯 Palpites</button>
          </div>

                <div><span style="color:var(--muted);font-size:9px">(${s.shots_on_b??'?'}✓)</span> ${s.shots_b}</div>`:''}
              ${s.corners_a!=null?`
                <div>${s.corners_a}</div>
                <div style="font-size:9px;color:var(--muted)">Escanteios</div>
                <div>${s.corners_b}</div>`:''}
              ${s.fouls_a!=null?`
                <div>${s.fouls_a}</div>
                <div style="font-size:9px;color:var(--muted)">Faltas</div>
                <div>${s.fouls_b}</div>`:''}
            </div>
          </div>`;
        })() : ''}
      </div>
      <div class="palpites-panel" id="panel-${g.id}">
        <div class="sec-title" style="margin-top:8px">Palpites dos participantes</div>
        <div class="palpites-grid">
          ${g.palpites.map(p=>{
            let pts=null;
            if(res&&status==='FINISHED') pts=calcPts(p.a,p.b,res.a,res.b);
            else if(p.pts!=null&&g.data<='2026-06-18') pts=p.pts;
            const pc=pts===5?'pts-5':pts===2?'pts-2':pts===0?'pts-0':'pts-pending';
            return `<div class="palpite-item${pts===5?' acerto-exato':''}">
              <span class="palpite-nome">${p.nm}</span>
              <span class="palpite-score">${p.a}×${p.b}</span>
              ${pts===null?"":"<span class=\"palpite-pts ${pc}\">"+pts+"pts</span>"}
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  });

  if(!filtered.length) {
    html += hasSearch
      ? `<div class="empty">Nenhum jogo encontrado para "${jogosSearch}"</div>`
      : `<div class="empty">Nenhum jogo nesta data</div>`;
  }
  cardsEl.innerHTML = html;
}

function toggleHeroPanel(panelId, iconEl) {
  const el = document.getElementById(panelId);

  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : 'block';
  if(iconEl) iconEl.textContent = isOpen ? '▾' : '▴';
}

function toggleJogoPanel(panelId, btn) {
  // Fecha outros painéis do mesmo card antes de abrir
  const prefix = panelId.includes('gols-') ? panelId.replace('gols-','estats-') : panelId.replace('estats-','gols-');
  const other = document.getElementById(prefix);
  if(other && other.style.display !== 'none') other.style.display = 'none';
  const el = document.getElementById(panelId);
  if(!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function renderRanking() {
  const el = document.getElementById('content-ranking');
  const isAnyLiveR = hasLiveGame();
  let rank = [];
  try { rank = buildRanking(false); } catch(e) { console.error('buildRanking error:', e); }
  if(!rank || !rank.length) {
    try { rank = buildRanking(false); } catch(e2) {}
  }
  // Ranking provisório para mostrar setas + pts provisórios
  let provRank = [];
  let provPtsMap = {}; // n → total provisório
  if(isAnyLiveR) {
    try {
      provRank = buildRanking(true);
      provRank.forEach(p => provPtsMap[p.n] = p.total);
      // Copiar posChange do provRank para rank
      const provPosMap = {};
      provRank.forEach((p, i) => { provPosMap[p.n] = { posChange: p.posChange }; });
      rank.forEach(p => { if(provPosMap[p.n]) p.posChange = provPosMap[p.n].posChange; else p.posChange = null; });
    } catch(e) {}
  }
  // Calcula histórico de posições jogo a jogo
  const jogosEncerrados = GDATA.filter(g => {
    const res = getResult(g.id);
    return res && (res.status==='FINISHED' || HISTORICAL_RESULTS[g.id]);
  }).sort((a,b)=>a.id-b.id);

  // Para cada participante, acumula pts após cada jogo
  const historico = {}; // n → [pts_após_jogo1, pts_após_jogo2, ...]
  rank.forEach(p => { historico[p.n] = []; });
  let acumPts = {};
  rank.forEach(p => acumPts[p.n] = 0);
  jogosEncerrados.forEach(g => {
    const res = getResult(g.id);
    if(!res) return;
    rank.forEach(p => {
      const palp = g.palpites.find(x=>x.n===p.n);
      if(palp) {
        let pts = 0;
        if(res.status==='FINISHED'||HISTORICAL_RESULTS[g.id]) pts = calcPts(palp.a,palp.b,res.a,res.b);
        else if(palp.pts!=null) pts = palp.pts;
        acumPts[p.n] = (acumPts[p.n]||0) + pts;
      }
      historico[p.n].push(acumPts[p.n]||0);
    });
  });

  let html = `
  <button class="share-btn" onclick="compartilharRanking()">📤 Compartilhar ranking</button>
  <div class="card">
    <div class="card-header"><span class="card-title">🏆 Classificação Geral</span><span class="card-badge">${rank.length} participantes</span></div>`;
  rank.forEach((p,i)=>{
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    // Barras de resultado jogo a jogo (0=vermelho, 2=amarelo, 5=verde)
    const ptsList = jogosEncerrados.map(g => {
      const res = getResult(g.id);
      if(!res) return null;
      const palp = g.palpites.find(x => x.n === p.n);
      if(!palp) return null;
      return calcPts(palp.a, palp.b, res.a, res.b);
    }).filter(v => v !== null);

    let sparkSVG = '';
    if(ptsList.length > 0) {
      const barW = 4, gap = 1.5, H = 20;
      const totalW = ptsList.length * (barW + gap) - gap;
      const bars = ptsList.map((v, idx) => {
        const color = v===5 ? '#22c55e' : v===2 ? '#eab308' : '#ef4444';
        const barH = v===5 ? 16 : v===2 ? 10 : 5;
        const x = idx * (barW + gap);
        const y = H - barH;
        return `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="1" fill="${color}" opacity="0.85"/>`;
      }).join('');
      sparkSVG = `<svg width="${totalW}" height="${H}" style="display:block">${bars}</svg>`;
    }
    html += `<div style="border-bottom:1px solid var(--borda)">
      <div class="ranking-item" onclick="toggleSpark(${p.n})" style="cursor:pointer;border-bottom:none">
        <span class="ranking-pos ${i<3?'pos-'+(i+1):''}">${medal||i+1}</span>
        ${getAvatar(p.nm,p.n-1)}
        <div class="ranking-info">
          <div class="ranking-nome">${p.nm}</div>
          <div class="ranking-detalhe">✅ ${p.j5} exatos · 🟡 ${p.j2} acertos · ❌ ${p.j0} erros</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
          <div class="ranking-pts">${p.total}<small>pts</small></div>
          ${isAnyLiveR && p.posChange !== null && p.posChange !== undefined
            ? getPosChange(p, provPtsMap[p.n])
            : ''}
        </div>
      </div>
      ${sparkSVG ? `<div id="spark-${p.n}" style="display:none;padding:8px 14px 10px;border-top:1px solid var(--borda)">
        <div style="font-size:9px;color:var(--muted);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase">Desempenho por jogo</div>
        <div style="display:flex;align-items:flex-end;gap:1.5px;overflow-x:auto">${sparkSVG}</div>
        <div style="display:flex;gap:10px;margin-top:5px;font-size:9px;color:var(--muted)">
          <span><span style="display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:1px;margin-right:2px;vertical-align:middle"></span>5pts</span>
          <span><span style="display:inline-block;width:8px;height:8px;background:#eab308;border-radius:1px;margin-right:2px;vertical-align:middle"></span>2pts</span>
          <span><span style="display:inline-block;width:8px;height:8px;background:#ef4444;border-radius:1px;margin-right:2px;vertical-align:middle"></span>0pts</span>
        </div>
      </div>` : ''}
    </div>`;;
  });
  html += `</div>
  <div style="text-align:center;color:#888;font-size:11px;padding:6px 0">✅ Placar exato = 5pts · 🟡 Vencedor certo = 2pts · ❌ Errou = 0pts</div>`;
  el.innerHTML = html;
}

// ── Atualização manual de placar ────────────────────────────
document.addEventListener('change', function(e) {
  // Toggle datetime input para mensagem agendada
  if(e.target.name === 'msgTiming') {
    const dtInput = document.getElementById('adminMsgSchedule');
    if(dtInput) dtInput.style.display = e.target.value === 'scheduled' ? 'block' : 'none';
  }
  if(e.target.id !== 'manualJogoSel') return;
  const gid = parseInt(e.target.value);
  const row = document.getElementById('manualPlacarRow');
  const tA = document.getElementById('manualTimeA');
  const tB = document.getElementById('manualTimeB');
  if(!gid) {
    if(row) row.style.display = 'none';
    return;
  }
  const g = GDATA.find(x => x.id === gid);
  if(!g) return;
  if(row) row.style.display = 'flex';
  if(tA) tA.textContent = g.A;
  if(tB) tB.textContent = g.B;
  // Pre-fill with existing score if any
  const res = liveResults[gid] || HISTORICAL_RESULTS[gid];
  if(res && res.a !== null) {
    const inpA = document.getElementById('manualGolA');
    const inpB = document.getElementById('manualGolB');
    if(inpA) inpA.value = res.a;
    if(inpB) inpB.value = res.b;
  }
});

async function salvarPlacarManual(status) {
  const gid = parseInt(document.getElementById('manualJogoSel')?.value || '0');
  if(!gid) { showToast('Selecione um jogo primeiro'); return; }
  const a = parseInt(document.getElementById('manualGolA')?.value ?? 0);
  const b = parseInt(document.getElementById('manualGolB')?.value ?? 0);
  if(isNaN(a) || isNaN(b)) { showToast('Placar inválido'); return; }

  const g = GDATA.find(x => x.id === gid);
  const result = { a, b, status };

  // Update liveResults immediately
  liveResults[gid] = result;

  // Save to JSONBin
  const statusEl = document.getElementById('manualStatus');
  if(statusEl) statusEl.textContent = '💾 Salvando...';

  await jbSave();

  // Re-render all tabs
  checkRankingChange();
  renderCurrentTab();

  // Update live badge
  const hasLive = Object.values(liveResults).some(r => r.status==='IN_PLAY'||r.status==='PAUSED');
  document.getElementById('liveBadge').style.display = hasLive ? 'flex' : 'none';

  const emoji = status === 'FINISHED' ? '🏁' : '⚽';
  const label = status === 'FINISHED' ? 'Encerrado' : 'Ao vivo';
  if(statusEl) statusEl.textContent = `${emoji} ${g?.A} ${a} × ${b} ${g?.B} — ${label} — salvo!`;
  showToast(`✅ Placar salvo: ${a}×${b} (${label})`);
}

async function limparPlacarManual() {
  const gid = parseInt(document.getElementById('manualJogoSel')?.value || '0');
  if(!gid) { showToast('Selecione um jogo primeiro'); return; }
  delete liveResults[gid];
  await jbSave();
  renderCurrentTab();
  const statusEl = document.getElementById('manualStatus');
  if(statusEl) statusEl.textContent = `🗑 Placar do jogo ${gid} removido`;
  showToast('Placar removido');
}

// ── Mensagem Admin ──────────────────────────────────
function insertEmoji(emoji) {
  const ta = document.getElementById('adminMsgText');
  if(!ta) return;
  const pos = ta.selectionStart || ta.value.length;
  ta.value = ta.value.slice(0,pos) + emoji + ta.value.slice(pos);
  ta.focus();
  ta.setSelectionRange(pos+emoji.length, pos+emoji.length);
}

async function salvarMsgAdmin() {
  const text = document.getElementById('adminMsgText')?.value?.trim();
  if(!text) { showToast('Digite uma mensagem primeiro'); return; }
  const timing = document.querySelector('input[name="msgTiming"]:checked')?.value || 'next';
  let scheduleAt = null;
  if(timing === 'scheduled') {
    const dtVal = document.getElementById('adminMsgSchedule')?.value;
    if(!dtVal) { showToast('Defina o horário de exibição'); return; }
    scheduleAt = new Date(dtVal).toISOString();
  }
  const msgObj = { text, timing, scheduleAt, createdAt: new Date().toISOString() };
  adminMsgAtivo = msgObj;
  await jbSave();
  // Atualiza preview
  atualizaPreviewMsg(msgObj);
  document.getElementById('adminMsgText').value = '';
  showToast('✅ Mensagem publicada!');
  document.getElementById('adminMsgStatus').textContent = '✅ Salvo às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

async function limparMsgAdmin() {
  adminMsgAtivo = null;
  await jbSave();
  document.getElementById('adminMsgPreview').style.display = 'none';
  document.getElementById('adminMsgText').value = '';
  document.getElementById('adminMsgStatus').textContent = '🗑 Mensagem removida';
  showToast('Mensagem removida');
}

function atualizaPreviewMsg(msgObj) {
  const preview = document.getElementById('adminMsgPreview');
  const previewText = document.getElementById('adminMsgPreviewText');
  const previewTime = document.getElementById('adminMsgPreviewTime');
  if(!preview) return;
  if(!msgObj || !msgObj.text) { preview.style.display='none'; return; }
  preview.style.display = 'block';
  previewText.textContent = msgObj.text;
  if(msgObj.timing === 'scheduled' && msgObj.scheduleAt) {
    previewTime.textContent = '⏰ Agendada para: ' + new Date(msgObj.scheduleAt).toLocaleString('pt-BR');
  } else {
    previewTime.textContent = '📤 Próximo carregamento';
  }
}

function checkAdminMsg(data) {
  if(!data || !data.adminMsg || !data.adminMsg.text) return;
  const msg = data.adminMsg;
  adminMsgAtivo = msg; // mantém em memória para o jbSave incluir
  // Verificar se já foi exibida nesta sessão
  const shownKey = 'adminMsgShown_' + (msg.createdAt||'');
  if(sessionStorage.getItem(shownKey)) return;
  // Verificar agendamento
  if(msg.timing === 'scheduled' && msg.scheduleAt) {
    if(new Date() < new Date(msg.scheduleAt)) return; // ainda não chegou a hora
  }
  // Exibir popup após 1.5s
  setTimeout(() => showAdminMsgPopup(msg, shownKey), 1500);
}

function showAdminMsgPopup(msg, shownKey) {
  sessionStorage.setItem(shownKey, '1');
  const overlay = document.createElement('div');
  overlay.className = 'msg-popup-overlay';
  overlay.innerHTML = `
    <div class="msg-popup">
      <div class="msg-popup-title">📣 Aviso do Bolão</div>
      <div class="msg-popup-body">${msg.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <button class="msg-popup-btn" onclick="this.closest('.msg-popup-overlay').remove()">👍 Entendido!</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
}

function showGroqDebug() {
  const el = document.getElementById('groqDebugPanel');
  if(!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if(!groqLastRaw) {
    el.textContent = 'Ainda sem dados. Aguarde um jogo ao vivo e tente novamente.';
    return;
  }
  const parsed = groqLastParsed ? JSON.stringify(groqLastParsed, null, 2) : 'JSON não parseado';
  el.innerHTML = '<b>RAW (primeiros 300 chars):</b><br>' 
    + groqLastRaw.replace(/</g,'&lt;').replace(/>/g,'&gt;')
    + '<br><br><b>PARSED:</b><br>' 
    + parsed.replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function compartilharRanking() {
  const rank = buildRanking(false);
  if(!rank || !rank.length) { showToast('Ranking ainda não disponível'); return; }
  const jogosFeitos = GDATA.filter(g => {
    const res = getResult(g.id);
    return res && (res.status==='FINISHED'||HISTORICAL_RESULTS[g.id]);
  }).length;
  const medals = ['🥇','🥈','🥉'];
  const linhas = rank.map((p,i) => {
    const med = medals[i] || `${i+1}º`;
    return `${med} ${p.nm.split(' ')[0]} — ${p.total}pts`;
  });
  const texto = [
    `🏆 Bolão MPRN · Copa 2026`,
    `📊 Ranking após ${jogosFeitos} jogo${jogosFeitos!==1?'s':''}:`,
    '',
    ...linhas,
    '',
    `✅ Exato=5pts · 🟡 Acerto=2pts · ❌ Errou=0pts`
  ].join('\n');

  if(navigator.share) {
    navigator.share({ text: texto }).catch(()=>{});
  } else if(navigator.clipboard) {
    navigator.clipboard.writeText(texto).then(() => showToast('✅ Ranking copiado!'));
  } else {
    // Fallback: textarea temporária
    const ta = document.createElement('textarea');
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✅ Ranking copiado!');
  }
}

function toggleSpark(n) {
  const el = document.getElementById('spark-'+n);
  if(!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function toggleApi() {
  apiEnabled = !apiEnabled;
  localStorage.setItem('apiEnabled', apiEnabled);
  if(apiEnabled) startPolling();
  else { if(pollTimer) clearTimeout(pollTimer); updateApiStatus(false, 'Pausado'); }
  renderConfig();
  showToast(apiEnabled ? '✅ Atualização automática ativada' : '⏸ Atualização pausada');
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// INIT
// ============================================================
renderInicio();
if(apiEnabled) startPolling();

// Limpa chaves antigas do localStorage (de versões anteriores)
['jsonbinBinId'].forEach(k => localStorage.removeItem(k));

// Carrega resultados do JSONBin compartilhado ao iniciar
setTimeout(jbLoad, 1500);
setTimeout(updateNotifHeaderBtn, 500);
// Inicializa snapshot de ranking se ainda não existe
try {
  if(!localStorage.getItem('prevRank')) {
    const initRank = buildRanking(false);
    const snap = {};
    initRank.forEach((p, i) => snap[p.n] = i + 1);
    localStorage.setItem('prevRank', JSON.stringify(snap));
  }
} catch(e) {}
// groqLastFetchTime = 0 já garante busca imediata no startup

// Narrador autônomo — roda independente do polling de placar
function scheduleNarrator() {
  if(narratorTimer) clearTimeout(narratorTimer);
  const liveGame = findCurrentGame();
  const interval = liveGame ? NARRATOR_LIVE_MS : NARRATOR_IDLE_MS;
  narratorTimer = setTimeout(async () => {
    const currentLive = findCurrentGame();
    if(currentLive) {
      // Jogo ao vivo → narra sobre o jogo
      fetchNarrator(currentLive, liveResults[currentLive.id] || {});
    } else {
      // Sem jogo → narra curiosidades sobre o próximo
      const nextG = findNextGame();
      fetchNarratorIdle(nextG);
    }
    scheduleNarrator(); // agenda próxima execução
  }, interval);
}
// Inicia narrador após 5s (garante que renderInicio já rodou)
setTimeout(() => {
  const liveNow = findCurrentGame();
  if(liveNow) {
    fetchNarrator(liveNow, liveResults[liveNow.id] || {});
  } else {
    fetchNarratorIdle(findNextGame());
  }
  scheduleNarrator();
}, 5000);

// Handle visibility change - re-fetch when user returns to tab
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && apiEnabled) {
    if(pollTimer) clearTimeout(pollTimer);
    fetchESPN().finally(scheduleNextPoll);
  }
});

// Pre-notify for upcoming games (20 min before)
setInterval(() => {
  GDATA.forEach(g => {
    const gdt = new Date(g.data+'T'+g.hora+':00-03:00');
    const diff = (gdt-new Date())/60000;
    if(diff > 19 && diff <= 20) {
      showBanner(`⏰ Jogo em 20 minutos!`, `${getFlag(g.A)} ${g.A} × ${g.B} ${getFlag(g.B)}`);
    }
  });
}, 60000);
