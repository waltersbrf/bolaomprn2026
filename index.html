<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --verde:#009c3b;--amarelo:#FFDF00;--azul:#002776;
  --verde-escuro:#006d28;--amarelo-escuro:#c9a800;--azul-escuro:#001a55;
  --cinza:#f4f4f0;--texto:#1a1a1a;--muted:#666;--borda:#ddd;
  --card-bg:#fff;--radius:12px;--radius-sm:8px;
}
html,body{height:100%;overflow:hidden;background:#006d28}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--verde-escuro);color:var(--texto);font-size:14px}
.app{max-width:480px;margin:0 auto;
  height:100vh;
  height:100dvh;
  min-height:-webkit-fill-available;
  display:flex;flex-direction:column;background:var(--cinza);position:relative;
  padding-bottom:env(safe-area-inset-bottom)}

/* HEADER */
.header{background:linear-gradient(135deg,var(--verde-escuro) 0%,var(--verde) 50%,var(--amarelo-escuro) 100%);padding:10px 14px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:8px}
.logo-ball{width:32px;height:32px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{color:#fff;font-weight:700;font-size:16px;line-height:1.1}
.logo-text small{font-size:10px;font-weight:400;opacity:.85;display:block}
.header-right{display:flex;align-items:center;gap:8px}
.live-badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:3px 10px;color:#fff;font-size:11px;font-weight:600;display:none;align-items:center;gap:5px}
.live-dot{width:7px;height:7px;background:#f00;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
/* api-status movido para Config */
/* Indicador de sincronização no header */
.sync-indicator{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.65);transition:opacity .4s}
.sync-indicator.hidden{opacity:0;pointer-events:none}
.sync-pulse{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);flex-shrink:0;transition:background .3s}
.sync-pulse.spinning{background:transparent;border:1.5px solid rgba(255,255,255,.7);border-top-color:transparent;animation:spin .7s linear infinite}
.sync-pulse.ok{background:#7fff7f;animation:none}
.sync-pulse.err{background:#ff7f7f;animation:none}

/* SCROLL AREA */
.content{flex:1;overflow-y:auto;padding:12px;padding-bottom:8px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* BOTTOM NAV */
.bottom-nav{background:linear-gradient(135deg,var(--verde-escuro) 0%,var(--verde) 50%,var(--amarelo-escuro) 100%);display:flex;padding:8px 8px 12px;gap:4px;flex-shrink:0;box-shadow:0 -2px 12px rgba(0,0,0,.2)}
.nav-btn{flex:1;padding:7px 4px;background:transparent;border:none;border-radius:var(--radius-sm);color:rgba(255,255,255,.65);font-size:11px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
.nav-btn.active{background:rgba(255,255,255,.2);color:#fff}
.nav-btn svg{width:20px;height:20px;stroke-width:1.8}

/* CARDS */
.card{background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--borda);overflow:hidden;margin-bottom:12px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(90deg,var(--verde) 0%,var(--verde-escuro) 100%)}
.card-title{color:#fff;font-weight:700;font-size:13px}
.card-badge{background:var(--amarelo);color:var(--azul-escuro);font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px}

/* JOGO CARD */
.jogo-card{background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--borda);overflow:hidden;margin-bottom:10px}
.jogo-meta{background:var(--azul-escuro);color:rgba(255,255,255,.8);font-size:10px;padding:4px 12px;display:flex;justify-content:space-between;align-items:center}
.jogo-live-min{color:#ff6b6b;font-weight:700;animation:blink .8s infinite}
.jogo-body{padding:12px 14px}
.jogo-confronto{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:4px}
.time-bloco{display:flex;flex-direction:column;align-items:center;flex:1;gap:2px}
.time-flag-big{font-size:28px;line-height:1.2}
.time-nome-small{font-weight:700;font-size:11px;color:var(--texto);text-align:center;word-break:break-word;max-width:90px;line-height:1.2}
.placar-box{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.placar-num{background:var(--cinza);border:1.5px solid var(--borda);border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:var(--texto);transition:.3s}
.placar-num.updated{background:#d4edda;border-color:#28a745}
.placar-sep{font-weight:700;color:var(--muted);font-size:14px}
.jogo-footer{display:flex;justify-content:space-between;align-items:center}
.pts-5{background:#d4edda;color:#155724}.pts-2{background:#fff3cd;color:#856404}
.pts-0{background:#f8d7da;color:#721c24}.pts-pending{background:#e2e3e5;color:#495057}
.btn-sm{border:none;border-radius:20px;padding:4px 12px;font-size:10px;font-weight:700;cursor:pointer}
.btn-amarelo{background:var(--amarelo);color:var(--azul-escuro)}
.btn-azul{background:var(--azul-escuro);color:#fff}
.btn-verde{background:var(--verde);color:#fff}

/* PALPITES PANEL */
.palpites-panel{display:none;padding:0 14px 12px;border-top:1px solid var(--borda);margin-top:2px}
.palpites-panel.open{display:block}
.palpite-item.acerto-exato{background:linear-gradient(135deg,#d4edda,#c3e6cb);border-color:#28a745}
.palpite-item.acerto-exato .palpite-nome{color:#155724;font-weight:700}
.palpite-item.acerto-exato .palpite-score{color:#155724;font-weight:800}
.share-btn{display:flex;align-items:center;gap:6px;background:var(--verde);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;margin:10px auto 4px;width:fit-content}
.share-btn:active{transform:scale(.97)}
.historico-chart{padding:12px 14px 8px}
.palpites-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.palpite-item{background:var(--cinza);border-radius:var(--radius-sm);padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.palpite-nome{font-size:11px;color:var(--texto);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palpite-score{font-weight:700;font-size:12px;color:var(--azul-escuro);white-space:nowrap}
.palpite-pts{font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;white-space:nowrap}

/* HERO */
.prejogo-hero{background:linear-gradient(135deg,var(--azul-escuro) 0%,var(--azul) 60%,var(--verde) 100%);border-radius:var(--radius);padding:14px;margin-bottom:12px;color:#fff}
.prejogo-label{font-size:10px;font-weight:700;letter-spacing:1px;opacity:.8;text-transform:uppercase;margin-bottom:6px}
.prejogo-times{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.prejogo-time{text-align:center;flex:1}
.prejogo-time-flag{font-size:36px;line-height:1.2}
.prejogo-team-logo{width:52px;height:52px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.form-dots{display:flex;gap:3px;justify-content:center;margin-top:4px}
.form-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.form-W{background:#22c55e}.form-D{background:#eab308}.form-L{background:#ef4444}
.venue-label{text-align:center;font-size:10px;opacity:.65;margin-top:6px;letter-spacing:.3px}
.prejogo-time-nome{font-weight:700;font-size:12px;margin-top:3px;opacity:.9}
.prejogo-vs{font-size:18px;font-weight:800;opacity:.5}
.placar-hero{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0}
.placar-hero-num{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff}
.placar-hero-sep{font-weight:700;font-size:18px;color:rgba(255,255,255,.6)}
.countdown{background:rgba(255,255,255,.15);border-radius:var(--radius-sm);padding:7px 14px;text-align:center;font-size:17px;font-weight:800;letter-spacing:3px;margin-top:10px}
@keyframes heroPulse{0%,100%{opacity:1}50%{opacity:.4}}
/* STAT BARS */
.stat-bar-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:2px 6px;font-size:10px;text-align:center;margin-top:6px}
.stat-bar-wrap .stat-val{font-weight:700}
.stat-bar-wrap .stat-label{opacity:.6;font-size:9px}
.stat-bar{height:4px;border-radius:2px;margin:2px 0}
.hero-expand-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:none;border-radius:20px;color:#fff;font-size:10px;font-weight:700;padding:5px 12px;cursor:pointer;flex:1;justify-content:center}
.hero-expand-btn:active{background:rgba(255,255,255,.25)}
.hero-expand-row{display:flex;gap:6px;margin-top:10px}
.hero-panel{border-top:1px solid rgba(255,255,255,.2);padding-top:10px;margin-top:8px}
.lance-item{display:flex;align-items:center;gap:6px;font-size:10px;padding:2px 0}
.lance-min{opacity:.6;white-space:nowrap;min-width:32px}
.stat-bar-jogo{height:4px;border-radius:2px;background:var(--borda)}
.stat-bar-jogo-fill{height:4px;border-radius:2px}
.countdown small{font-size:10px;opacity:.7;display:block;font-weight:400;letter-spacing:0}

/* DONUT */
.donut-wrap{padding:14px;background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--borda);margin-bottom:12px}
.bet-bar-wrap{display:flex;flex-direction:column;gap:8px}
.bet-bar{display:flex;height:28px;border-radius:8px;overflow:hidden;width:100%}
.bet-bar-seg{cursor:pointer;transition:opacity .2s;flex-shrink:0}
.bet-bar-seg:hover{opacity:.8}
.bet-bar-legend{display:flex;justify-content:space-between;gap:2px;flex-wrap:nowrap;overflow:hidden}
.bet-leg-item{display:flex;align-items:center;gap:3px;font-size:10px;cursor:pointer;color:var(--texto);white-space:nowrap;min-width:0;overflow:hidden}
.bet-leg-item:hover{opacity:.7}
.bet-leg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
/* Narrador — card independente */
.narrator-card-outer{background:linear-gradient(135deg,#0d1f3c 0%,#1a3358 100%);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;color:#fff;position:relative}
.narrator-card-outer::after{content:'🎙️';position:absolute;right:12px;top:10px;font-size:22px;opacity:.15;pointer-events:none}
.narrator-label{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.narrator-body{font-size:13px;line-height:1.6;font-style:italic;opacity:.92}
.narrator-loading{display:inline-flex;align-items:center;gap:4px;opacity:.5;font-style:normal}
.narrator-dot{width:5px;height:5px;border-radius:50%;background:#fff;display:inline-block;animation:blink .8s infinite}
.narrator-dot:nth-child(2){animation-delay:.25s}
.narrator-dot:nth-child(3){animation-delay:.5s}
.donut-title{font-weight:700;font-size:13px;margin-bottom:10px;color:var(--texto)}
.donut-legend{display:flex;justify-content:center;gap:14px;margin-top:10px;flex-wrap:wrap}
.donut-leg-item{display:flex;align-items:center;gap:4px;font-size:11px}
.donut-leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* RANKING */
.ranking-item{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--borda);gap:10px}
.ranking-item:last-child{border-bottom:none}
.ranking-pos{font-weight:800;font-size:14px;min-width:22px;text-align:center;color:var(--muted)}
.pos-1{color:#FFD700}.pos-2{color:#C0C0C0}.pos-3{color:#CD7F32}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;color:#fff;text-align:center;gap:0}
.ranking-info{flex:1;min-width:0}
.ranking-nome{font-weight:700;font-size:13px;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ranking-detalhe{font-size:10px;color:var(--muted)}
.ranking-pts{font-weight:800;font-size:16px;color:var(--verde-escuro);white-space:nowrap}
.pos-change{font-size:10px;font-weight:700;display:flex;align-items:center;gap:1px;white-space:nowrap;opacity:.9}
.pos-up{color:#00a651}.pos-down{color:#e63946}.pos-same{color:#c9a800}
.ranking-pts small{font-size:10px;color:var(--muted);font-weight:400;margin-left:1px}

/* FILTROS */
.filtros-wrap{position:relative;margin-bottom:10px}
.filtros-nav{position:absolute;top:50%;transform:translateY(-60%);z-index:2;background:linear-gradient(to right,#f5f5f0 60%,transparent);border:none;cursor:pointer;font-size:14px;color:var(--muted);padding:2px 4px 2px 0;line-height:1}
.filtros-nav.right{right:0;background:linear-gradient(to left,#f5f5f0 60%,transparent);padding:2px 0 2px 4px}
.filtros{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none;scroll-behavior:smooth}
.filtros::-webkit-scrollbar{display:none}
.filtro-btn{padding:5px 12px;border-radius:20px;border:1.5px solid var(--borda);background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;flex-shrink:0;transition:.15s}
.filtro-btn.active{background:var(--verde);border-color:var(--verde);color:#fff}

/* BUSCA */
.busca-wrap{position:relative;margin-bottom:12px}
.busca-input{width:100%;padding:9px 14px 9px 36px;border-radius:var(--radius-sm);border:1.5px solid var(--borda);font-size:13px;background:#fff;color:var(--texto);outline:none}
.busca-input:focus{border-color:var(--verde)}
.busca-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}

.sec-title{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;margin-top:4px}

/* PESSOA */
.pessoa-card{background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--borda);margin-bottom:10px;overflow:hidden}
.pessoa-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.pessoa-jogos{display:none;padding:8px 14px 12px}
.pessoa-jogos.open{display:block}
.pessoa-jogo-row{display:flex;align-items:center;padding:5px 0;border-bottom:1px solid var(--cinza);font-size:12px;gap:4px}
.pessoa-jogo-row:last-child{border-bottom:none}

/* NOTIF BANNER */
.notif-banner{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;background:var(--azul-escuro);color:#fff;padding:12px 16px;border-radius:var(--radius-sm);z-index:999;font-size:13px;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3);animation:slideDown .3s ease}
@keyframes slideDown{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.notif-banner.show{display:block}
.notif-banner-title{font-weight:700;margin-bottom:2px}
.notif-banner-close{position:absolute;right:12px;top:10px;background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:0}

/* PWA INSTALL */
.pwa-banner{background:linear-gradient(135deg,var(--verde-escuro),var(--verde));color:#fff;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;font-size:12px;flex-shrink:0}
.pwa-banner.show{display:flex}
.pwa-banner-text{flex:1}
.pwa-banner-text strong{display:block;font-size:13px}
.pwa-btn{background:var(--amarelo);color:var(--azul-escuro);border:none;border-radius:20px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.pwa-close{background:none;border:none;color:rgba(255,255,255,.7);font-size:18px;cursor:pointer;padding:2px 4px}

/* TOAST */
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--azul-escuro);color:#fff;padding:10px 20px;border-radius:var(--radius-sm);font-size:12px;z-index:999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* LOADER */
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.1);border-top-color:var(--verde);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
/* TV Panel */
.tv-btn{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.8);padding:4px;display:flex;align-items:center;border-radius:6px;transition:.2s;text-decoration:none}
.tv-btn:hover{color:#FF0000;background:rgba(255,255,255,.1)}

@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 0}

/* ADMIN */
.admin-section{background:#fff3cd;border:1px solid #ffc107;border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:12px}
.admin-section strong{display:block;margin-bottom:6px;color:#856404}
/* POPUP MENSAGEM ADMIN */
.msg-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.msg-popup{background:#fff;border-radius:14px;padding:22px 20px 18px;max-width:340px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.25);animation:popIn .25s ease}
@keyframes popIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.msg-popup-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--verde-escuro);margin-bottom:10px;opacity:.8}
.msg-popup-body{font-size:15px;line-height:1.6;color:var(--texto);white-space:pre-wrap;word-break:break-word;margin-bottom:18px}
.msg-popup-btn{width:100%;padding:11px;background:var(--verde);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
/* EDITOR EMOJI */
.emoji-picker{display:none;flex-wrap:wrap;gap:4px;background:#f9f9f9;border:1px solid var(--borda);border-radius:8px;padding:8px;margin-top:6px;max-height:120px;overflow-y:auto}
.emoji-picker.open{display:flex}
.emoji-btn{font-size:20px;cursor:pointer;padding:2px 4px;border-radius:4px;border:none;background:none;line-height:1;transition:transform .1s}
.emoji-btn:hover{transform:scale(1.25);background:rgba(0,0,0,.06)}
.msg-textarea{width:100%;min-height:80px;padding:9px 11px;border:1.5px solid var(--borda);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical;color:var(--texto);line-height:1.5}
.msg-textarea:focus{border-color:var(--verde);outline:none}

/* CONFIG PANEL */
.config-panel{background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--borda);padding:14px;margin-bottom:12px}
.config-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--cinza)}
.config-row:last-child{border-bottom:none}
.config-label{font-size:13px;color:var(--texto)}
.config-label small{display:block;font-size:10px;color:var(--muted);margin-top:1px}
.toggle{width:44px;height:24px;background:#ccc;border-radius:12px;position:relative;cursor:pointer;transition:.2s;border:none;flex-shrink:0}
.toggle.on{background:var(--verde)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
.toggle.on::after{left:22px}
</style>
</head>

// Avatar helper
function getPosChange(p, provTotal) {
  if(p.posChange === null || p.posChange === undefined) return '';
  const pts = provTotal !== undefined ? ` · ${provTotal}pts` : '';
  if(p.posChange > 0)  return `<span class="pos-change pos-up">▲${p.posChange}${pts}</span>`;
  if(p.posChange < 0)  return `<span class="pos-change pos-down">▼${Math.abs(p.posChange)}${pts}</span>`;
  return `<span class="pos-change pos-same">—${pts ? ' · ' + provTotal + 'pts' : ''}</span>`;
}

const getAvatar = (nm, idx) => {
  // Extrai inicial do primeiro nome
  const firstName = nm.split(' ')[0];
  const initial = firstName[0].toUpperCase();
  // Extrai grupo entre parênteses ex: "Carol Vilar (DOFC)" → "DOFC"
  const groupMatch = nm.match(/\(([^)]+)\)/);
  const group = groupMatch ? groupMatch[1] : '';
  const groupHtml = group
    ? `<span style="font-size:7px;font-weight:700;letter-spacing:.3px;opacity:.85;line-height:1;margin-top:1px;display:block">${group}</span>`
    : '';
  return `<div class="avatar" style="background:${COLORS[idx%COLORS.length]};flex-direction:column;justify-content:center;line-height:1">

  </div>`;
};

// Scoring
const calcPts = (a,b,ra,rb) => {
  if(ra===null||rb===null) return null;
  if(a===ra&&b===rb) return 5;
  const pw=a>b?'A':a<b?'B':'E', rw=ra>rb?'A':ra<rb?'B':'E';
  return pw===rw?2:0;
};

// Get result for a game
const getResult = (gid) => liveResults[gid] || null;

// Build ranking
// buildRanking(provisional=false):
//   provisional=false → só jogos encerrados (ranking oficial)
//   provisional=true  → inclui placar ao vivo (ranking "se o jogo terminar agora")
// Detecta se há jogo ao vivo usando gameStatus (inclui detecção por tempo)
const hasLiveGame = () => GDATA.some(g => {
  const s = gameStatus(g);
  return s === 'IN_PLAY' || s === 'PAUSED' || s === 'HALFTIME';
});

// buildRanking(provisional):
//   false = ranking oficial (só jogos FINISHED)
//   true  = ranking provisório (inclui jogo ao vivo com placar atual)
const buildRanking = (provisional = false) => {
  const s = {};
  GDATA.forEach(g => {
    const status = gameStatus(g); // usa detecção por tempo também
    const hist = HISTORICAL_RESULTS[g.id];
    const live = liveResults[g.id];

    // Resolve placar: histórico > liveResults > placar 0x0 se ao vivo
    let ra = null, rb = null, isFinished = false, isLiveNow = false;
    if(hist) {
      ra = hist.a; rb = hist.b; isFinished = true;
    } else if(live && live.a !== null && live.a !== undefined) {
      ra = live.a; rb = live.b;
      isFinished = live.status === 'FINISHED';
      isLiveNow  = live.status === 'IN_PLAY' || live.status === 'PAUSED';
    } else if(status === 'IN_PLAY' || status === 'PAUSED') {
      // Jogo detectado como ao vivo por tempo mas sem placar da API ainda → 0×0
      ra = 0; rb = 0; isLiveNow = true;
    } else if(status === 'FINISHED' && !hist) {
      // Encerrado por tempo mas sem resultado → fallback CSV
      // (será tratado abaixo pelo p.pts)
    }

    g.palpites.forEach(p => {
      if(!s[p.n]) s[p.n] = {n:p.n, nm:p.nm, total:0, j5:0, j2:0, j0:0, jpend:0};
      let pts = null;

      if(isFinished) {
        pts = calcPts(p.a, p.b, ra, rb);
      } else if(isLiveNow) {
        if(provisional) {
          // Provisório: conta como se o placar atual fosse o final
          pts = calcPts(p.a, p.b, ra, rb);
        } else {
          pts = null; // Oficial: ainda não conta
        }
      } else if(ra === null && p.pts != null) {
        // Fallback: pts do CSV apenas para jogos que já deveriam ter encerrado
        const gdtFallback = new Date(g.data+'T'+g.hora+':00-03:00');
        const minutesPast = (new Date() - gdtFallback) / 60000;
        if(minutesPast > 110) pts = p.pts; // só conta se passou tempo suficiente
      }

      if(pts === null) { s[p.n].jpend++; return; }
      s[p.n].total += pts;
      if(pts === 5) s[p.n].j5++;
      else if(pts === 2) s[p.n].j2++;
      else s[p.n].j0++;
    });
  });

  const ranked = Object.values(s).sort((a,b) => b.total-a.total || b.j5-a.j5 || b.j2-a.j2);

  // ── Calcula variação de posição ──────────────────────────────
  if(provisional && hasLiveGame()) {
    // Compara posição SEM o jogo ao vivo (ranking base) vs COM o placar atual
    const base = buildRanking(false);
    const basePos = {};
    base.forEach((p, i) => basePos[p.n] = i + 1);
    ranked.forEach((p, i) => {
      const bp = basePos[p.n];
      p.posChange = (bp !== undefined) ? bp - (i + 1) : null;
    });
  } else {
    // Sem jogo ao vivo: compara com snapshot salvo antes do último jogo
    let prevRank = {};
    try { prevRank = JSON.parse(localStorage.getItem('prevRank') || '{}'); } catch(e){}
    ranked.forEach((p, i) => {
      const prev = prevRank[p.n];
      p.posChange = (prev !== undefined) ? prev - (i + 1) : null;
    });
    // Salva snapshot só quando não há jogo ao vivo (preserva base pré-jogo)
    if(!provisional && !hasLiveGame()) {
      const snap = {};
      ranked.forEach((p, i) => snap[p.n] = i + 1);
      localStorage.setItem('prevRank', JSON.stringify(snap));
    }
  }

  return ranked;
};

const fmtDate = d => { const[y,m,day]=d.split('-'); return `${day}/${m}`; };
const fmtDateFull = d => { const[y,m,day]=d.split('-'); return `${day}/${m}/${y}`; };

const gameStatus = g => {
  // 1. Resultado confirmado (API ou histórico) → usa o status real
  const hist = HISTORICAL_RESULTS[g.id];
  if(hist) return hist.status; // sempre FINISHED

  const live = liveResults[g.id];
  if(live && live.a !== null && live.b !== null) return live.status;

  // 2. Sem resultado → usa tempo como estimativa
  const now = new Date();
  const gdt = new Date(g.data+'T'+g.hora+':00-03:00');
  const diff = (gdt - now) / 60000; // minutos desde o início

  if(diff > 2)    return 'SCHEDULED'; // ainda não começou
  if(diff > -105)  return 'IN_PLAY';   // até 105min (90+15 intervalo)
  return 'FINISHED';                    // passou mais de 105min → encerrado
};

const findNextGame = () => {
  const now = new Date();
  let best=null, bd=Infinity;
  GDATA.forEach(g => {
    const gdt = new Date(g.data+'T'+g.hora+':00-03:00');
    const d = gdt-now;
    if(d>0&&d<bd){bd=d;best=g;}
  });
  return best;
};

const findCurrentGame = () => {
  return GDATA.find(g => {
    const s = gameStatus(g);
    return s==='IN_PLAY'||s==='PAUSED'||s==='HALFTIME';
  }) || null;
};

const getPalpiteDist = g => {
  let a=0,d=0,b=0;
  g.palpites.forEach(p=>{if(p.a>p.b)a++;else if(p.a<p.b)b++;else d++;});
  return {winA:a,draw:d,winB:b,total:g.palpites.length};
};

async function jbLoad() {
  syncStart('Sync');
  try {
    // Lê dados.json direto do GitHub Pages (raw) — sem custo, sem limite
    const r = await fetch(GH_RAW + '?t=' + Date.now());
    if(!r.ok) {
      console.warn('GitHub load failed:', r.status);
      updateJbStatus(false, 'Erro '+r.status);
      return;
    }
    const data = await r.json();
    // Busca SHA em paralelo para ter pronto quando precisar salvar
    fetch(GH_API, {
      headers: { 'Authorization': `Bearer ${GH_TOKEN}`, 'Accept': 'application/vnd.github+json' }
    }).then(r => r.ok ? r.json() : null).then(m => { if(m?.sha) ghFileSha = m.sha; }).catch(()=>{});
    if(data && data.results && Object.keys(data.results).length > 0) {
      Object.entries(data.results).forEach(([id, res]) => {
        const gid = parseInt(id);
        const cur = liveResults[gid];
        // Só sobrescreve se não há jogo ao vivo local
        if(!cur || cur.status !== 'IN_PLAY') {
          // Mantém placar do HISTORICAL_RESULTS mas aceita stats/goals/events do JSONBin
          if(HISTORICAL_RESULTS[gid]) {
            liveResults[gid] = {
              ...HISTORICAL_RESULTS[gid],
              stats:  res.stats  || null,
              goals:  res.goals  || [],
              events: res.events || [],
            };
          } else {
            liveResults[gid] = { ...res, savedToGH: true };
          }
        }
      });
      renderCurrentTab();
    }
    // Restaura datas ESPN já cobertas
    if(data && data.espnDates && Array.isArray(data.espnDates)) {
      data.espnDates.forEach(d => espnDatesCovered.add(d));
    }
    // Verifica mensagem do admin
    checkAdminMsg(data);
    const syncTime = data.updatedAt
      ? new Date(data.updatedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
      : '';
    syncDone(true);
    updateJbStatus(true, syncTime);
  } catch(e) {
    console.warn('JSONBin load error:', e);
    syncDone(false, 'JSONBin');
    updateJbStatus(false, 'Offline');
  }
}

let ghFileSha = null; // SHA atual do arquivo no GitHub (necessário para PUT)

async function jbSave() {
  if(jsonbinSaving) return;
  jsonbinSaving = true;
  try {
    const toSave = {};
    Object.entries(liveResults).forEach(([id, res]) => {
      if(res && (res.a !== null && res.a !== undefined)) toSave[id] = res;
    });
    const payload = {
      results: toSave,
      espnDates: [...espnDatesCovered],
      adminMsg: adminMsgAtivo || null,
      updatedAt: new Date().toISOString()
    };
    const content64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));

    // Busca SHA atual se não tiver (necessário para atualizar arquivo existente)
    if(!ghFileSha) {
      try {
        const meta = await fetch(GH_API, {
          headers: { 'Authorization': `Bearer ${GH_TOKEN}`, 'Accept': 'application/vnd.github+json' }
        });
        if(meta.ok) { const m = await meta.json(); ghFileSha = m.sha; }
      } catch(e) {}
    }

    const body = {
      message: `update dados.json ${new Date().toISOString()}`,
      content: content64,
      branch: GH_BRANCH,
    };
    if(ghFileSha) body.sha = ghFileSha;

    const r = await fetch(GH_API, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${GH_TOKEN}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if(!r.ok) {
      const err = await r.json().catch(()=>({}));
      console.warn('GitHub save failed:', r.status, err.message);
      // Se conflito de SHA (409/422), busca SHA novo e tenta de novo
      if(r.status === 409 || r.status === 422) {
        try {
          const meta = await fetch(GH_API, {
            headers: { 'Authorization': `Bearer ${GH_TOKEN}`, 'Accept': 'application/vnd.github+json' }
          });
          if(meta.ok) { const m = await meta.json(); ghFileSha = m.sha; }
          console.log('SHA atualizado, retentando...');
          jsonbinSaving = false;
          jbSave(); // retry
        } catch(e2) { console.warn('Retry falhou:', e2); }
      }
      updateJbStatus(false, 'Erro ' + r.status);
    } else {
      const resp = await r.json();
      ghFileSha = resp.content?.sha || null; // atualiza SHA para próxima escrita
      updateJbStatus(true, new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    }
  } catch(e) {
    console.warn('GitHub save error:', e);
    updateJbStatus(false, 'Offline');
  } finally {
    jsonbinSaving = false;
  }
}

const espnDatesCovered = new Set();

// Gera todas as datas da fase de grupos: 11/06 → 28/06/2026
function copaGroupDates() {
  const dates = [];
  for(let d = new Date('2026-06-11'); d <= new Date('2026-06-28'); d.setDate(d.getDate()+1)) {
    dates.push(d.toISOString().slice(0,10).replace(/-/g,''));
  }
  return dates;
}

// Normaliza forma: ESPN em pt retorna V/E/D; em en retorna W/D/L
function normForm(f) {
  if(!f) return null;
  return f.split('').map(c => c==='V'?'W': c==='E'?'D': c==='D'?'L': c).join('');
}

// Processa um evento ESPN (competition object) e atualiza liveResults
function processESPNEvent(ev) {
  const comp = ev.competitions?.[0];
  if(!comp) return;
  const compA = comp.competitors?.find(c => c.homeAway === 'home');
  const compB = comp.competitors?.find(c => c.homeAway === 'away');
  if(!compA || !compB) return;

  // Mapa de aliases: displayName ESPN pt-BR → nome no bolão
  const ESPN_NAME_ALIAS = {
    'Curaçao': 'Curaçau',
    'Países Baixos': 'Holanda',
    'EUA': 'Estados Unidos',
    // Possíveis grafias alternativas ESPN pt-BR
    'Congo DR': 'RD Congo',
    'DR Congo': 'RD Congo',
    'Congo, Rep. Dem.': 'RD Congo',
    'República Democrática do Congo': 'RD Congo',
    'Rep. Dem. do Congo': 'RD Congo',
    'Irão': 'Irã',
    'Costa do Marfim': 'Costa do Marfim',
    'Burkina Faso': 'Burkina Faso',
    'Arabia Saudita': 'Arábia Saudita',
  };
  // Mapa por ESPN team.id → nome no bolão (mais robusto que displayName)
  const ESPN_ID_MAP = {
    '478':'França','654':'Senegal','4398':'Catar','475':'Suíça',
    '205':'Brasil','2869':'Marrocos','2654':'Haiti','580':'Escócia',
    '660':'Estados Unidos','628':'Austrália','465':'Turquia','210':'Paraguai',
    '206':'Canadá','203':'México','451':'Coreia do Sul','452':'Bósnia',
    '450':'República Tcheca','467':'África do Sul',
  };
  // Resolve nome do time: prioridade ID > displayName > abreviação
  const resolveTeam = (comp) => {
    // 1. Por ESPN team.id (mais robusto)
    const byId = ESPN_ID_MAP[comp.team.id];
    if(byId) return byId;
    // 2. Por displayName com alias
    const dn = comp.team.displayName || '';
    const nome = ESPN_NAME_ALIAS[dn] || dn;
    if(GDATA.some(g => g.A === nome || g.B === nome)) return nome;
    // 3. Fallback: abreviação via ESPN_TEAM_MAP
    return espnTeam(comp.team.abbreviation);
  };
  const nameA = resolveTeam(compA);
  const nameB = resolveTeam(compB);

  // Salva form e logo no ESPN_META (com normalização V/E/D → W/D/L)
  if(compA.team.logo) ESPN_META[nameA] = { logo: compA.team.logo, color: compA.team.color, form: normForm(compA.form) };
  if(compB.team.logo) ESPN_META[nameB] = { logo: compB.team.logo, color: compB.team.color, form: normForm(compB.form) };

  // Encontra o jogo correspondente no bolão
  const game = GDATA.find(g =>
    (g.A === nameA && g.B === nameB) || (g.A === nameB && g.B === nameA)
  );
  if(!game) return;

  // Guarda mapeamento bolão id → ESPN event id
  ESPN_GAME_IDS[game.id] = ev.id;
  if(comp.venue?.fullName) ESPN_META['venue_bolao_'+game.id] = { name: comp.venue.fullName, city: comp.venue.address?.city || '' };

  const espnStatus = comp.status?.type?.name || 'STATUS_SCHEDULED';
  const swapped = (nameA === game.B);

  const scoreA = parseInt(compA.score || '0');
  const scoreB = parseInt(compB.score || '0');
  const ra = swapped ? scoreB : scoreA;
  const rb = swapped ? scoreA : scoreB;

  const displayClock = comp.status?.displayClock || '';
  const minute = displayClock.replace("'","").trim() || null;

  let status;
  if(espnStatus === 'STATUS_IN_PROGRESS') status = 'IN_PLAY';
  else if(espnStatus === 'STATUS_HALFTIME') status = 'PAUSED';
  else if(['STATUS_FULL_TIME','STATUS_FINAL_OT','STATUS_FINAL_PEN'].includes(espnStatus)) status = 'FINISHED';
  else status = 'SCHEDULED';

  // Extrai eventos (gols + cartões) dos details
  const events = [];
  (comp.details || []).forEach(det => {
    const teamId = det.team?.id || '';
    const teamName = teamId === compA.team.id ? nameA : nameB;
    const minuteEvt = det.clock?.displayValue?.replace("'",'') || '?';
    const player = (det.athletesInvolved||[])[0]?.displayName || '?';
    if(det.scoringPlay)    events.push({ type:'goal',        player, team:teamName, minute:minuteEvt, penalty:det.penaltyKick||false, og:det.ownGoal||false });
    else if(det.yellowCard) events.push({ type:'yellow_card', player, team:teamName, minute:minuteEvt });
    else if(det.redCard)    events.push({ type:'red_card',    player, team:teamName, minute:minuteEvt });
  });
  events.sort((a,b) => parseInt(a.minute||0) - parseInt(b.minute||0));
  const goals = events.filter(e => e.type==='goal');

  // Extrai statistics
  const getStat = (c, name) => { const s=c.statistics?.find(s=>s.name===name); return s?parseFloat(s.displayValue):null; };
  const sCA = swapped ? compB : compA;
  const sCB = swapped ? compA : compB;
  const stats = {
    possession_a:getStat(sCA,'possessionPct'), possession_b:getStat(sCB,'possessionPct'),
    shots_a:getStat(sCA,'totalShots'),         shots_b:getStat(sCB,'totalShots'),
    shots_on_a:getStat(sCA,'shotsOnTarget'),   shots_on_b:getStat(sCB,'shotsOnTarget'),
    corners_a:getStat(sCA,'wonCorners'),       corners_b:getStat(sCB,'wonCorners'),
    fouls_a:getStat(sCA,'foulsCommitted'),     fouls_b:getStat(sCB,'foulsCommitted'),
  };
  const hasStats = Object.values(stats).some(v => v !== null);

  // Para jogos históricos: mantém placar do HISTORICAL_RESULTS mas atualiza stats/events
  const existing = liveResults[game.id] || {};
  const isHistorical = !!HISTORICAL_RESULTS[game.id];
  const prev = existing;

  liveResults[game.id] = {
    a: isHistorical ? existing.a : (existing.savedToGH && existing.status==='FINISHED' ? existing.a : ra),
    b: isHistorical ? existing.b : (existing.savedToGH && existing.status==='FINISHED' ? existing.b : rb),
    status: isHistorical ? 'FINISHED' : status,
    minute: isHistorical ? null : minute,
    events: events.length ? events : existing.events || [],
    goals:  goals.length  ? goals  : existing.goals  || [],
    stats:  hasStats ? stats : existing.stats || null,
    savedToGH: existing.savedToGH || false,
  };

  if(!isHistorical) {
    if(status==='FINISHED' && prev.status!=='FINISHED') {
      // Transição: jogo acabou agora
      notifyGameEnd(game,ra,rb);
      liveResults[game.id].savedToGH = true;
      jbSave();
    } else if(status==='FINISHED' && !prev.savedToGH) {
      // Jogo já encerrado quando o app abriu — ainda não estava no dados.json
      liveResults[game.id].savedToGH = true;
      jbSave();
    }
    if(status==='IN_PLAY' && (!prev.status||prev.status==='SCHEDULED')) notifyGameStart(game);
  }
}

async function fetchESPN() {
  if(!apiEnabled) return;
  syncStart('ESPN');
  try {
    const prevResults = JSON.stringify(liveResults);
    const today = new Date();
    // Data de hoje no fuso de Brasília (UTC-3)
    const todayBR = new Date(today.getTime() - 3*3600000).toISOString().slice(0,10).replace(/-/g,'');

    // ── Passo 1: varrer datas passadas não cobertas ──────────────
    const allDates = copaGroupDates();
    // Só considera "coberta" se todos os jogos da data já têm stats salvas
    const uncovered = allDates.filter(d => {
      if(d >= todayBR) return false;
      if(!espnDatesCovered.has(d)) return true;
      // Re-verifica: se algum jogo encerrado da data não tem stats, rebusca
      return GDATA.filter(g => g.data.replace(/-/g,'') === d)
        .some(g => { const r=liveResults[g.id]; return r && r.status==='FINISHED' && !r.stats; });
    });

    if(uncovered.length > 0) {
      const resps = await Promise.all(
        uncovered.map(dt =>
          fetch(`${ESPN_SCOREBOARD}?dates=${dt}&lang=pt&region=br`)
            .then(r => r.ok ? r.json() : null)
            .catch(() => null)
        )
      );
      resps.forEach((data, i) => {
        if(!data) return;
        (data.events||[]).forEach(ev => processESPNEvent(ev));
        // Só marca como coberta se a resposta trouxe eventos com statistics
        const hasStats = (data.events||[]).some(ev =>
          ev.competitions?.[0]?.competitors?.some(c => (c.statistics||[]).length > 2)
        );
        if(hasStats) espnDatesCovered.add(uncovered[i]);
      });
      // Salva no JSONBin após varrer datas históricas
      jbSave();
    }

    // ── Passo 2: busca de hoje (jogos ao vivo e agendados) ───────
    const respHoje = await fetch(`${ESPN_SCOREBOARD}?dates=${todayBR}&lang=pt&region=br&t=${Date.now()}`);
    if(respHoje.ok) {
      const dataHoje = await respHoje.json();
      (dataHoje.events||[]).forEach(ev => processESPNEvent(ev));
    }

    checkRankingChange();
    if(JSON.stringify(liveResults) !== prevResults) {
      renderCurrentTab();
      const hasNew = Object.values(liveResults).some(r=>r.status==='FINISHED');
      if(hasNew) jbSave();
    }
    const hasLive = Object.values(liveResults).some(r=>r.status==='IN_PLAY'||r.status==='PAUSED');
    document.getElementById('liveBadge').style.display = hasLive?'flex':'none';

    syncDone(true);
    updateApiStatus(true, new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  } catch(err) {
    console.error('ESPN fetch error:', err);
    syncDone(false,'ESPN');
    updateApiStatus(false,'Offline');
  }
}


// Controla indicador de sincronização no header
let syncHideTimer = null;

function syncStart(label='') {
  const ind = document.getElementById('syncIndicator');
  const pulse = document.getElementById('syncPulse');
  const txt = document.getElementById('syncText');
  if(!ind) return;
  if(syncHideTimer) clearTimeout(syncHideTimer);
  ind.classList.remove('hidden');
  pulse.className = 'sync-pulse spinning';
  if(txt) txt.textContent = label;
}

function syncDone(ok=true, label='') {
  const ind = document.getElementById('syncIndicator');
  const pulse = document.getElementById('syncPulse');
  const txt = document.getElementById('syncText');
  if(!ind) return;
  pulse.className = 'sync-pulse ' + (ok ? 'ok' : 'err');
  if(txt) txt.textContent = label || (ok ? new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : 'Erro');
  // Desaparece após 3s se OK, 5s se erro
  syncHideTimer = setTimeout(() => ind.classList.add('hidden'), ok ? 3000 : 5000);
}

function updateApiStatus(ok, msg='') {
  const dot = document.getElementById('apiDot');
  const txt = document.getElementById('apiStatusText');
  if(dot) dot.style.background = ok ? '#00c851' : '#ff4444';
  if(txt) txt.textContent = ok
    ? (lastApiUpdate ? 'Online · ' + lastApiUpdate.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : 'Online')
    : (msg || 'Offline');
}

function startPolling() {
  fetchESPN();
  scheduleNextPoll();
}

function scheduleNextPoll() {
  if(pollTimer) clearTimeout(pollTimer);
  const hasLive = Object.values(liveResults).some(r => r.status==='IN_PLAY'||r.status==='PAUSED');
  const interval = hasLive ? POLL_INTERVAL_LIVE : POLL_INTERVAL;
  pollTimer = setTimeout(async () => {
    if(!apiEnabled) return;
    await fetchESPN(); // ESPN: fonte principal gratuita, sem chave
    const liveGameNow = findCurrentGame();
    if(liveGameNow) {
      fetchNarrator(liveGameNow, liveResults[liveGameNow.id] || {});
    }
    scheduleNextPoll();
  }, interval);
}

function notifyGameStart(game) {
  showBanner(`⚽ Jogo começou!`, `${getFlag(game.A)} ${game.A} × ${game.B} ${getFlag(game.B)} — Jogo ${game.id}`, 8000);
}

function notifyGameEnd(game, ra, rb) {
  showBanner(`🏁 Fim de jogo ${game.id}!`, `${getFlag(game.A)} ${game.A} ${ra} × ${rb} ${game.B} ${getFlag(game.B)}`, 10000);
}

function checkRankingChange() {
  const rank = buildRanking();
  if(rank.length > 0) {
    const leader = rank[0].nm;
    if(prevRankLeader && prevRankLeader !== leader) {
      showBanner('🏆 Mudança no ranking!', `${leader} assumiu a liderança!`, 8000);
    }
    prevRankLeader = leader;
  }
}

function updateNotifHeaderBtn() {
  const btn = document.getElementById('notifHeaderBtn');
  if(!btn) return;
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  if(perm === 'granted') {
    btn.title = 'Notificações ativas ✅';
    btn.querySelector('svg').setAttribute('fill', 'rgba(255,255,255,.4)');
    btn.style.opacity = '.5';
  } else if(perm === 'denied') {
    btn.title = 'Notificações bloqueadas — altere nas configurações do navegador';
    btn.querySelector('svg').setAttribute('stroke', '#ff6b6b');
    btn.style.opacity = '.8';
  } else {
    btn.title = 'Toque para ativar notificações';
    btn.style.opacity = '.7';
  }
}

async function toggleNotifFromHeader() {
  if(!('Notification' in window)) {
    showToast('Seu navegador não suporta notificações');
    return;
  }
  const perm = Notification.permission;
  if(perm === 'granted') {
    showToast('🔔 Notificações já estão ativas!');
    return;
  }
  if(perm === 'denied') {
    showToast('🔕 Notificações bloqueadas — libere nas configurações do navegador');
    return;
  }
  await requestNotifPermission();
}

async function requestNotifPermission() {
  if(!('Notification' in window)) { showToast('Notificações não suportadas neste navegador'); return; }
  const perm = await Notification.requestPermission();
  if(perm === 'granted') {
    notifEnabled = true;
    localStorage.setItem('notifEnabled', 'true');
    showToast('✅ Notificações ativadas!');
  } else {
    showToast('Permissão negada para notificações');
  }
  updateNotifHeaderBtn();
}

    document.getElementById('pwaBanner').classList.add('show');

  deferredPwaPrompt = null;
  document.getElementById('pwaBanner').classList.remove('show');
  showToast('✅ App instalado com sucesso!');
});

  deferredPwaPrompt.prompt();
  const { outcome } = await deferredPwaPrompt.userChoice;
  if(outcome === 'accepted') showToast('✅ App instalado!');
  deferredPwaPrompt = null;

let configUnlocked = false;

function askConfigPassword() {
  if(configUnlocked) {
    showTab('config');
    return;
  }
  // Show custom password dialog
  const overlay = document.createElement('div');
  overlay.id = 'passOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.3)">
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:32px">🔒</div>
        <div style="font-weight:700;font-size:16px;color:#1a1a1a;margin-top:6px">Área restrita</div>
        <div style="font-size:12px;color:#666;margin-top:4px">Digite a senha para acessar as configurações</div>
      </div>
      <input id="passInput" type="password" placeholder="Senha" autocomplete="off"
        style="width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;outline:none;margin-bottom:12px;text-align:center"
        onkeydown="if(event.key==='Enter')checkConfigPass()">
      <div style="display:flex;gap:8px">
        <button onclick="document.getElementById('passOverlay').remove()"
          style="flex:1;padding:10px;border:1.5px solid #ddd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;color:#666">Cancelar</button>
        <button onclick="checkConfigPass()"
          style="flex:1;padding:10px;border:none;border-radius:8px;background:#009c3b;color:#fff;font-size:13px;font-weight:700;cursor:pointer">Entrar</button>
      </div>
      <div id="passError" style="color:#e63946;font-size:12px;text-align:center;margin-top:8px;display:none">Senha incorreta</div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('passInput')?.focus(), 100);
}

function checkConfigPass() {
  const val = document.getElementById('passInput')?.value || '';
  if(val.toLowerCase() === 'mozart') {
    configUnlocked = true;
    document.getElementById('passOverlay')?.remove();
    showTab('config');
  } else {
    const err = document.getElementById('passError');
    if(err) { err.style.display = 'block'; }
    const inp = document.getElementById('passInput');
    if(inp) { inp.value = ''; inp.focus(); }
  }
}

function showTab(tab) {
  // Se saindo de config, bloqueia novamente
  if(activeTab === 'config' && tab !== 'config') configUnlocked = false;
  ['inicio','jogos','ranking','pessoa','config'].forEach(t => {
    document.getElementById('content-'+t).style.display = (t===tab?'block':'none');
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  activeTab = tab;
  renderCurrentTab();
}

function renderCurrentTab() {
  if(activeTab==='inicio') renderInicio();
  else if(activeTab==='jogos') renderJogos();
  else if(activeTab==='ranking') renderRanking();
  else if(activeTab==='pessoa') renderPessoa();
  else if(activeTab==='config') renderConfig();
}

// ── Busca placar ao vivo via Groq compound-beta (web search) ─
async function fetchLiveScoreViaGroq(game) {
  if(!game) return null;
  const key = ['gsk_Rt4mj0HQTfA06BRNV4x','WWGdyb3FYM8VuSRR8oSh4YGvLwqfgui4t'].join('');
  const matchStr = game.A + ' vs ' + game.B + ' FIFA World Cup 2026';

  // ── Chamada 1: placar + minuto (JSON simples) ──────────────
  let result = null;
  try {
    const r1 = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({
        model: 'compound-beta',
        max_tokens: 200,
        messages: [{role:'user', content:
          'Search the web now for the live score of: ' + matchStr + '. '
          + 'Reply ONLY with this JSON (real numbers, no text outside): '
          + '{"scoreA":0,"scoreB":0,"minute":45,"status":"IN_PLAY",'
          + '"goals":[{"player":"Name","team":"' + game.A + '","minute":"23","penalty":false}]}'
        }]
      })
    });
    const d1 = await r1.json();
    let t1 = '';
    const c1 = d1.choices?.[0]?.message?.content;
    if(Array.isArray(c1)) t1 = (c1.find(c=>c.type==='text')?.text)||'';
    else t1 = c1||'';
    groqLastRaw = t1.substring(0,400);
    const m1 = [...t1.matchAll(/\{[\s\S]+?\}/g)];
    if(m1.length) {
      const parsed = JSON.parse(m1[m1.length-1][0]);
      if(typeof parsed.scoreA==='number') {
        result = parsed;
        groqLastParsed = parsed;
        console.log('[Groq] score+minute:', parsed);
      }
    }
    if(!result) {
      // Fallback: extract score from text like "3-0" or "3×0"
      const sm = t1.match(/(\d+)\s*[-×x:]\s*(\d+)/);
      if(sm) result = {scoreA:+sm[1],scoreB:+sm[2],status:'IN_PLAY',minute:null,goals:[]};
    }
  } catch(e) { console.warn('[Groq] score call error:', e); }

  // ── Chamada 2: estatísticas (texto livre → parse) ──────────
  try {
    const r2 = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({
        model: 'compound-beta',
        max_tokens: 350,
        messages: [{role:'user', content:
          'Search the web for LIVE match statistics of ' + matchStr + ' happening RIGHT NOW. '
          + 'Reply ONLY with this JSON (use real numbers from the match, no text outside the JSON): '
          + '{"pa":55,"pb":45,"sha":8,"shoa":3,"shb":5,"shob":1,"ca":3,"cb":2,"fa":10,"fb":7,"ya":1,"yb":2,"ra":0,"rb":0} '
          + 'where pa=possession% team A, pb=possession% team B, sha=shots team A, shoa=shots on target A, '
          + 'shb=shots team B, shob=shots on target B, ca=corners A, cb=corners B, '
          + 'fa=fouls A, fb=fouls B, ya=yellow cards A, yb=yellow cards B, ra=red cards A, rb=red cards B.'
        }]
      })
    });
    const d2 = await r2.json();
    let t2 = '';
    const c2 = d2.choices?.[0]?.message?.content;
    if(Array.isArray(c2)) t2 = (c2.find(c=>c.type==='text')?.text)||'';
    else t2 = c2||'';
    console.log('[Groq] stats raw:', t2.substring(0,300));
    const m2 = [...t2.matchAll(/\{[\s\S]+?\}/g)];
    if(m2.length) {
      const s = JSON.parse(m2[m2.length-1][0]);
      // Accept if it has at least possession fields
      if(s.pa!=null || s.sha!=null) {
        const stats = {
          possession_a: s.pa, possession_b: s.pb,
          shots_a: s.sha, shots_on_a: s.shoa,
          shots_b: s.shb, shots_on_b: s.shob,
          corners_a: s.ca, corners_b: s.cb,
          fouls_a: s.fa, fouls_b: s.fb,
          yellow_a: s.ya, yellow_b: s.yb,
          red_a: s.ra, red_b: s.rb,
        };
        result = result ? {...result, stats} : {scoreA:0,scoreB:0,status:'IN_PLAY',minute:null,goals:[],stats};
        console.log('[Groq] stats parsed:', stats);
      }
    }
  } catch(e) { console.warn('[Groq] stats call error:', e); }

  return result;
}


// ── Narrador Mozart — busca info ao vivo e narra com humor ───
async function fetchNarrator(game, res) {
  if(!game) return;

  const key = ['gsk_Rt4mj0HQTfA06BRNV4x','WWGdyb3FYM8VuSRR8oSh4YGvLwqfgui4t'].join('');
  const liveR  = liveResults[game.id] || HISTORICAL_RESULTS[game.id] || res || {};
  const scoreA = liveR.a ?? 0;
  const scoreB = liveR.b ?? 0;
  const status = liveR.status === 'FINISHED' ? 'Encerrado'
    : liveR.status === 'PAUSED' ? 'Intervalo' : 'Em andamento';

  const minuteSlot = Math.floor(Date.now() / 60000);
  const context = game.id + '-' + scoreA + '-' + scoreB + '-' + status + '-' + minuteSlot;
  if(context === narratorContext) return;
  narratorContext = context;

  // Ranking resumido (só posições, sem nomes)
  const rank = buildRanking(hasLiveGame());
  const pts1 = rank[0]?.total || 0;
  const ptsLast = rank[rank.length-1]?.total || 0;
  const acertosExatos = game.palpites.filter(p => p.ga === scoreA && p.gb === scoreB).length;
  const errouFeio = game.palpites.filter(p => {
    if(scoreA > scoreB) return p.gb > p.ga;
    if(scoreB > scoreA) return p.ga > p.gb;
    return p.ga !== p.gb;
  }).length;
  const acertouVencedor = game.palpites.filter(p => {
    if(scoreA > scoreB) return p.ga > p.gb;
    if(scoreB > scoreA) return p.gb > p.ga;
    return p.ga === p.gb;
  }).length;
  const nextGame = findNextGame();
  const proximoJogo = nextGame ? nextGame.A + ' x ' + nextGame.B : '';

  // Escolhe tema aleatório — todos usam web search via compound-beta
  const temaIdx = Math.floor(Math.random() * 5);
  const temas = [
    'Busque UMA curiosidade real e verificável sobre o jogo ' + game.A + ' x ' + game.B + ' da Copa 2026 que está acontecendo agora (placar ' + scoreA + 'x' + scoreB + '). Pode ser sobre os times, jogadores ou o momento do jogo.',
    'Busque UM fato curioso ou engraçado sobre a Copa do Mundo 2026 (recordes, curiosidades dos estádios, números inusitados). Algo real e verificável.',
    'Busque UMA curiosidade histórica real de Copas anteriores (gol bizarro, recorde, zebra). Relacione com o jogo atual ' + game.A + ' x ' + game.B + ' se possível.',
    'Contexto do bolão: 1º tem ' + pts1 + 'pts, último tem ' + ptsLast + 'pts, ' + acertosExatos + ' pessoa(s) acertaram o placar exato ' + scoreA + 'x' + scoreB + ', ' + errouFeio + ' erraram o lado. Comente isso com humor SEM citar nomes, só posições.',
    proximoJogo ? 'Busque uma curiosidade real sobre o próximo jogo ' + proximoJogo + '. Algo interessante sobre os times ou histórico entre eles.' : 'Busque um destaque real do jogo ' + game.A + ' x ' + game.B + ' que está acontecendo agora.',
  ];
  const tema = temas[temaIdx];

  const persona = 'Você é Mozart, admin do bolão Copa 2026 do MPRN. Natalense, fanático pelo ABC de Natal, fora de forma mas joga bola. Tom informal de WhatsApp.';
  const prompt = persona + ' ' + tema + ' Escreva exatamente 1 frase (máx 20 palavras). Sem inventar — só fatos reais. Nunca cite nomes de participantes, só posições no ranking.';

  try {
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+key},
      body: JSON.stringify({
        model: 'compound-beta',
        max_tokens: 120,
        temperature: 0.85,
        messages: [{role:'user', content: prompt}]
      })
    });
    const data = await resp.json();
    let text = '';
    const content = data.choices?.[0]?.message?.content;
    if(Array.isArray(content)) {
      text = content.find(c => c.type === 'text')?.text || '';
    } else {
      text = content || '';
    }
    if(text.trim()) {
      narratorText = text.trim();
      const elNow = document.getElementById('narratorText');
      if(elNow) elNow.textContent = narratorText;
      else if(activeTab === 'inicio') renderInicio();
    } else {
      narratorContext = ''; // retry next cycle
    }
  } catch(e) {
    console.warn('Narrator error:', e);
    narratorContext = '';
  }
}

function toggleInicioPalpites() {
  const panel = document.getElementById('inicioPalpitesPanel');
  const btn = panel.previousElementSibling.querySelector('button');
  if(panel.style.display !== 'none') {
    panel.style.display = 'none';
    btn.textContent = 'Ver todos os palpites ▾';
    return;
  }
  // Build full palpites grid for heroGame
  const heroGame = findCurrentGame() || findNextGame();
  const tgChartGame = heroGame?.palpites?.length > 0
    ? heroGame
    : GDATA.slice().reverse().find(g => g.palpites && g.palpites.length > 0) || heroGame;
  const tgGame = tgChartGame || heroGame;
  if(!tgGame) return;
  const res = HISTORICAL_RESULTS[tgGame.id] || (liveResults[tgGame.id]?.a !== null ? liveResults[tgGame.id] : null);
  const status = gameStatus(tgGame);
  const rows = tgGame.palpites.map(p => {
    let pts = null;
    if(res && res.status === 'FINISHED') pts = calcPts(p.a, p.b, res.a, res.b);
    else if(p.pts != null && heroGame.data <= '2026-06-18') pts = p.pts;
    const pc = pts===5?'pts-5':pts===2?'pts-2':pts===0?'pts-0':'pts-pending';
    return `<div class="palpite-item">
      <span class="palpite-nome">${p.nm}</span>
      <span class="palpite-score">${p.a}×${p.b}</span>
      ${pts===null?"":"<span class=\"palpite-pts ${pc}\">"+pts+"pts</span>"}
    </div>`;
  }).join('');
  panel.innerHTML = `<div class="palpites-grid" style="margin-top:0">${rows}</div>`;
  panel.style.display = 'block';
  btn.textContent = 'Fechar palpites ▴';
}

function renderInicio() {
  const el = document.getElementById('content-inicio');
  try {
  const liveGame = findCurrentGame();
  const nextGame = findNextGame();

  // Se não há jogo ao vivo, verifica se há jogo recente sem resultado confirmado
  // (garante que o hero não pule para o próximo jogo enquanto o atual pode ainda estar rolando)
  let heroGame = liveGame;
  if(!heroGame) {
    const now = new Date();
    const recentGame = GDATA.find(g => {
      // Já tem resultado confirmado → não é "recente sem resultado"
      if(HISTORICAL_RESULTS[g.id]) return false;
      const live = liveResults[g.id];
      if(live && live.status === 'FINISHED') return false;
      // Se gameStatus diz FINISHED (por tempo), também exclui
      if(gameStatus(g) === 'FINISHED') return false;
      // Verifica se o jogo deveria ter começado mas ainda não tem resultado
      const gdt = new Date(g.data+'T'+g.hora+':00-03:00');
      const diff = (now - gdt) / 60000;
      return diff > 0 && diff <= 105;
    });
    heroGame = recentGame || nextGame;
  }

  const liveCount = GDATA.filter(g => {
    const s=gameStatus(g); return s==='IN_PLAY'||s==='PAUSED';
  }).length;
  document.getElementById('liveBadge').style.display = liveCount>0?'flex':'none';

  // Para chart/palpites, usa o jogo com palpites disponíveis
  // (próximos jogos podem ainda não ter palpites carregados)
  // chartGame: próximo jogo com palpites disponíveis
  // Se heroGame tem palpites → usa heroGame
  // Senão → próximo jogo FUTURO com palpites (não o último passado)
  const chartGame = heroGame?.palpites?.length > 0
    ? heroGame
    : GDATA.find(g => g.palpites?.length > 0 && gameStatus(g) === 'SCHEDULED')
      || GDATA.slice().reverse().find(g => g.palpites?.length > 0)
      || heroGame;

  let html = '';
  window.currentHeroGame = heroGame;
  if(heroGame) {
    const status = gameStatus(heroGame);
    const res = getResult(heroGame.id);
    const dist = getPalpiteDist(heroGame);
    const isLive = status==='IN_PLAY'||status==='PAUSED';
    const gdt = new Date(heroGame.data+'T'+heroGame.hora+':00-03:00');

    const labelText = isLive ? `Jogo ${heroGame.id} · Fase de Grupos` :
      status==='FINISHED' ? `🏁 Encerrado — Jogo ${heroGame.id}` :
      (gdt-new Date())/60000 < 20 ? `🔥 Começa em breve — Jogo ${heroGame.id}` :
      `⏳ Próximo jogo — Jogo ${heroGame.id}`;

    // Metadados ESPN para o hero
    const logoA = getTeamLogo(heroGame.A);
    const logoB = getTeamLogo(heroGame.B);
    const formA = getTeamForm(heroGame.A);
    const formB = getTeamForm(heroGame.B);
    const venue = ESPN_META['venue_bolao_'+heroGame.id] || null;

    // form: ESPN retorna do mais antigo ao mais recente (ex: WDWLW = [ant→rec])
    // Para time A (esquerda): mais antigo à esquerda, mais recente à direita (próximo ao centro)
    // Para time B (direita): mais antigo à direita, mais recente à esquerda (próximo ao centro)
    const renderFormA = (form) => {
      if(!form) return '';
      // Ordem normal: mais antigo→externo, mais recente→interno(direita)
      return '<div class="form-dots">' + form.split('').map(c =>
        `<span class="form-dot form-${c}" title="${c==='W'?'Vitória':c==='D'?'Empate':'Derrota'}"></span>`
      ).join('') + '</div>';
    };
    const renderFormB = (form) => {
      if(!form) return '';
      // Invertido: mais recente→interno(esquerda), mais antigo→externo(direita)
      return '<div class="form-dots">' + form.split('').reverse().map(c =>
        `<span class="form-dot form-${c}" title="${c==='W'?'Vitória':c==='D'?'Empate':'Derrota'}"></span>`
      ).join('') + '</div>';
    };

    const renderTeamFlag = (name, logo) => logo
      ? `<img class="prejogo-team-logo" src="${logo}" alt="${name}" onerror="this.style.display='none';this.nextSibling.style.display='block'"><span style="display:none;font-size:36px;line-height:1.2">${getFlag(name)}</span>`
      : `<div class="prejogo-time-flag">${getFlag(name)}</div>`;

    html += `<div class="prejogo-hero">

    const showLiveDefault = isLive && (!res || res.a === null);

      const liveMin = liveResults[heroGame.id]?.minute || res?.minute || null;

      narratorLastRun = Date.now();
      const narRes = {
        a: (liveResults[heroGame.id]?.a ?? res?.a ?? 0),
        b: (liveResults[heroGame.id]?.b ?? res?.b ?? 0),
        status: (liveResults[heroGame.id]?.status || res?.status || 'IN_PLAY'),

      setTimeout(() => fetchNarrator(heroGame, narRes), 200);

    html += `</div>`;

    // Donut
    // ── Narrador — card fixo sempre visível ──────────────────
  html += `<div class="narrator-card-outer">

          <div class="bet-bar-seg" style="width:${Math.round(distChart.winA/distChart.total*100)}%;background:${getTeamColor(chartGame.A,'#009c3b')}"
            onclick="showDonutSlice(0,window.currentChartGame)"></div>
          <div class="bet-bar-seg" style="width:${Math.round(distChart.draw/distChart.total*100)}%;background:#B8A000"
            onclick="showDonutSlice(1,window.currentChartGame)"></div>
          <div class="bet-bar-seg" style="width:${Math.round(distChart.winB/distChart.total*100)}%;background:${getTeamColor(chartGame.B,'#002776')}"
            onclick="showDonutSlice(2,window.currentChartGame)"></div>
        </div>
        <div class="bet-bar-legend">
          <span class="bet-leg-item" onclick="showDonutSlice(0,window.currentChartGame)">
            <span class="bet-leg-dot" style="background:${getTeamColor(chartGame.A,'#009c3b')}"></span>
            ${getFlag(chartGame.A)} <span style="max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle">${chartGame.A}</span> <b>${Math.round(distChart.winA/distChart.total*100)}%</b>
          </span>
          <span class="bet-leg-item" onclick="showDonutSlice(1,window.currentChartGame)">
            <span class="bet-leg-dot" style="background:#B8A000"></span>
            Emp. <b>${Math.round(distChart.draw/distChart.total*100)}%</b>
          </span>
          <span class="bet-leg-item" onclick="showDonutSlice(2,window.currentChartGame)">
            <span class="bet-leg-dot" style="background:${getTeamColor(chartGame.B,'#002776')}"></span>
            ${getFlag(chartGame.B)} <span style="max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle">${chartGame.B}</span> <b>${Math.round(distChart.winB/distChart.total*100)}%</b>
          </span>
        </div>
        <div style="text-align:center;font-size:10px;color:var(--muted);margin-top:2px">👆 Toque em uma cor para ver os palpites</div>
      </div>
      <div id="donutSlicePanel" style="display:none;margin-top:12px;border-top:1px solid var(--borda);padding-top:10px"></div>
    </div>`;
  }



    // Palpites preview — usa chartGame (tem palpites disponíveis)
    if(chartGame.palpites && chartGame.palpites.length > 0) {
      const pHtml = chartGame.palpites.slice(0,6).map(p=>`
        <div class="palpite-item">
          <span class="palpite-nome">${p.nm.split(' ')[0]}</span>
          <span class="palpite-score">${p.a}×${p.b}</span>
        </div>`).join('');
      html += `<div class="card">
        <div class="card-header"><span class="card-title">🎯 Palpites — Jogo ${chartGame.id}</span><span class="card-badge">${chartGame.palpites.length}</span></div>
        <div style="padding:10px 14px">
          <div class="palpites-grid">${pHtml}</div>
          <div style="text-align:center;margin-top:8px"><button class="btn-sm btn-amarelo" onclick="toggleInicioPalpites()">Ver todos os palpites ▾</button></div>
          <div id="inicioPalpitesPanel" style="display:none;margin-top:8px"></div>
        </div>
      </div>`;
    }
  }

  // Top 5 — usa ranking provisório se há jogo ao vivo
  const isAnyLive = hasLiveGame();
  let rank;
  try { rank = buildRanking(false).slice(0,5); } catch(e) { rank = []; }
  let provPtsMapI = {};
  if(isAnyLive) {
    try {
      const prov = buildRanking(true);
      prov.forEach(p => provPtsMapI[p.n] = p.total);
      const provPosMapI = {};
      prov.forEach((p, i) => { provPosMapI[p.n] = p.posChange; });
      rank.forEach(p => { p.posChange = provPosMapI[p.n] !== undefined ? provPosMapI[p.n] : null; });
    } catch(e) {}
  }
  html += `<div class="card"><div class="card-header"><span class="card-title">🏆 Top 5 do Bolão</span></div>`;
  rank.forEach((p,i)=>{
    html += `<div class="ranking-item" onclick="toggleSpark(${p.n})" style="cursor:pointer">
      <span class="ranking-pos ${i<3?'pos-'+(i+1):''}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span>
      ${getAvatar(p.nm,p.n-1)}
      <div class="ranking-info"><div class="ranking-nome">${p.nm}</div><div class="ranking-detalhe">✅ ${p.j5} · 🟡 ${p.j2} · ❌ ${p.j0}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        <div class="ranking-pts">${p.total}<small>pts</small></div>
        ${isAnyLive && p.posChange !== null && p.posChange !== undefined
          ? getPosChange(p, provPtsMapI[p.n])
          : ''}
      </div>
    </div>`;
  });
  html += `<div style="padding:10px 14px;text-align:center"><button class="btn-sm btn-amarelo" onclick="showTab('ranking')">Ranking completo →</button></div></div>`;

  // Last update
  if(lastApiUpdate) {
    html += `<div style="text-align:center;color:#999;font-size:10px;padding:4px 0">Atualizado às ${lastApiUpdate.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>`;
  }

  el.innerHTML = html;
  // Countdown — dentro do try para ter acesso ao DOM após el.innerHTML
  if(heroGame) {
    const cdGame = gameStatus(heroGame)==='SCHEDULED' ? heroGame
      : GDATA.find(g => g.id !== heroGame.id && gameStatus(g)==='SCHEDULED') || null;
    if(cdGame) {
      const cdGdt = new Date(cdGame.data+'T'+cdGame.hora+':00-03:00');
      (function upd(){
        const els = ['countdown-hero'].map(id=>document.getElementById(id)).filter(Boolean);
        if(!els.length) return;
        const d = cdGdt - new Date();
          const txt = d<=0
            ? '⚽ APITO!<small>apito inicial</small>'
            : (()=>{const h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),s=Math.floor((d%60000)/1000);
                return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}<small>para o apito</small>`;})();
          els.forEach(el=>el.innerHTML=txt);
          if(d>0) setTimeout(upd,1000);
        })();
      }
    }

  } catch(err) {
    console.error('renderInicio error:', err);
    el.innerHTML = `<div style="padding:20px;text-align:center;color:#e63946">Erro ao carregar: ${err.message}<br><small>Recarregue a página</small></div>`;
  }
}

function drawDonut(cid, dist, g) {
  const c = document.getElementById(cid);
  if(!c || !window.Chart) return;
  if(donutChart) { try{donutChart.destroy();}catch(e){} }
  const pA=Math.round(dist.winA/dist.total*100),pD=Math.round(dist.draw/dist.total*100),pB=100-pA-pD;
  // Usa cores dos times — fallback para verde/amarelo/azul Brasil
  const cA = getTeamColor(g.A, '#009c3b');
  const cB = getTeamColor(g.B, '#002776');
  // Cor do empate: mix suave entre as duas cores (cinza dourado neutro)
  const cD = '#B8A000';
  // Garante contraste se as cores forem iguais
  const bgA = cA === cB ? cA : cA;
  const bgB = cA === cB ? '#444' : cB;
  donutChart = new Chart(c.getContext('2d'), {
    type:'doughnut',
    data:{
      labels:[`${g.A} vence (${pA}%)`,`Empate (${pD}%)`,`${g.B} vence (${pB}%)`],
      datasets:[{data:[dist.winA,dist.draw,dist.winB],
        backgroundColor:[bgA, cD, bgB],
        hoverBackgroundColor:[bgA+'CC', cD+'CC', bgB+'CC'],
        borderWidth:2, borderColor:'#fff'}]
    },
    options:{
      responsive:false,
      cutout:'68%',
      plugins:{legend:{display:false}},
      onClick(evt, elements) {
        if(!elements.length) { closeDonutSlice(); return; }
        const idx = elements[0].index; // 0=A wins, 1=draw, 2=B wins
        if(donutSliceOpen === idx) { closeDonutSlice(); return; }
        donutSliceOpen = idx;
        showDonutSlice(idx, g);
      }
    }
  });
}

function closeDonutSlice() {
  donutSliceOpen = null;
  const el = document.getElementById('donutSlicePanel');
  if(el) el.style.display = 'none';
}

function showDonutSlice(idx, g) {
  const el = document.getElementById('donutSlicePanel');
  if(!el) return;
  const res = getResult(g.id);
  const labels = [`Vitória ${g.A}`, 'Empate', `Vitória ${g.B}`];
  const cA = getTeamColor(g.A, '#009c3b');
  const cB = getTeamColor(g.B, '#002776');
  const colors = [cA, '#B8A000', cB];
  // Calcula luminância para decidir cor do texto
  const lum = c => { const r=parseInt(c.slice(1,3),16),g2=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16); return (0.299*r+0.587*g2+0.114*b)/255; };
  const textColors = [lum(cA)>0.5?'#1a1a1a':'#fff','#1a1a1a',lum(cB)>0.5?'#1a1a1a':'#fff'];

  // Filter palpites for this slice
  const palpites = g.palpites.filter(p => {
    if(idx===0) return p.a > p.b;   // A wins
    if(idx===1) return p.a === p.b; // draw
    if(idx===2) return p.a < p.b;   // B wins
  });

  const rows = palpites.map(p => {
    let pts = null;
    const status = gameStatus(g);
    if(res && status==='FINISHED') pts = calcPts(p.a, p.b, res.a, res.b);
    else if(p.pts != null && g.data <= '2026-06-18') pts = p.pts;
    const pc = pts===5?'pts-5':pts===2?'pts-2':pts===0?'pts-0':'pts-pending';
    const ptsLabel = pts===null?'':'<span class="palpite-pts '+pc+'">'+pts+'pts</span>';
    return `<div class="palpite-item">
      <span class="palpite-nome">${p.nm}</span>
      <span class="palpite-score">${p.a}×${p.b}</span>
      <span class="palpite-pts ${pc}">${ptsLabel}</span>
    </div>`;
  }).join('');

  el.style.display = 'block';
  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="background:${colors[idx]};color:${textColors[idx]};font-weight:700;font-size:12px;padding:4px 12px;border-radius:20px">
        ${getFlag(idx===2?g.B:g.A)} ${labels[idx]} — ${palpites.length} palpites
      </div>
      <button onclick="closeDonutSlice()" style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)">×</button>
    </div>
    <div class="palpites-grid">${rows || '<div style="color:var(--muted);font-size:12px;padding:4px 0">Nenhum palpite nesta categoria</div>'}</div>`;
}

function renderJogos() {
  const el = document.getElementById('content-jogos');
  const dates = [...new Set(GDATA.map(g=>g.data))].sort();

  // ── Abre no dia atual (ou o mais próximo com jogos) ──
  if(!jogosFiltroData) {
    const today = new Date().toISOString().split('T')[0];
    // Usa exatamente hoje se existir, senão o dia mais recente com jogos passados
    if(dates.includes(today)) {
      jogosFiltroData = today;
    } else {
      // Dia mais próximo antes de hoje
      const past = dates.filter(d => d <= today);
      jogosFiltroData = past.length ? past[past.length-1] : dates[0];
    }
  }

  // ── Busca ──
  // Se há texto de busca, ignora filtro de data (busca global)
  const hasSearch = jogosSearch.trim().length > 0;
  const activeDate = hasSearch ? null : jogosFiltroData;

  // ── Input e filtros: atualiza sem recriar o DOM ──
  let jogosEl = document.getElementById('content-jogos');
  let staticWrap = document.getElementById('jogos-static');
  if(!staticWrap) {
    // Primeira vez: cria estrutura estática (input + filtros)
    staticWrap = document.createElement('div');
    staticWrap.id = 'jogos-static';

    // Input de busca
    const buscaDiv = document.createElement('div');
    buscaDiv.className = 'busca-wrap';
    buscaDiv.innerHTML = `<svg class="busca-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="jogos-search-input" class="busca-input" placeholder="Buscar país ou nº do jogo..." value="">
      <button id="jogos-clear-btn" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);padding:0 4px">×</button>`;
    staticWrap.appendChild(buscaDiv);

    // Faixa de datas com setas
    const filtrosWrap = document.createElement('div');
    filtrosWrap.className = 'filtros-wrap';
    filtrosWrap.innerHTML = `
      <button class="filtros-nav left" onclick="document.getElementById('filtros-scroll').scrollBy({left:-120,behavior:'smooth'})">‹</button>
      <div id="filtros-scroll" class="filtros" style="padding:0 18px">
        <button id="filtro-todos" class="filtro-btn" onclick="jogosFiltroData=null;jogosSearch='';atualizaFiltros();renderJogosCards()">Todos</button>
      </div>
      <button class="filtros-nav right" onclick="document.getElementById('filtros-scroll').scrollBy({left:120,behavior:'smooth'})">›</button>`;
    staticWrap.appendChild(filtrosWrap);
    jogosEl.appendChild(staticWrap);

    // Adiciona datas ao filtro
    const filtrosScroll = document.getElementById('filtros-scroll');
    dates.forEach(d => {
      const [,m,day] = d.split('-');
      const btn = document.createElement('button');
      btn.className = 'filtro-btn';
      btn.id = 'filtro-' + d;
      btn.textContent = day + '/' + m;
      btn.onclick = () => { jogosFiltroData=d; jogosSearch=''; atualizaFiltros(); renderJogosCards(); };
      filtrosScroll.appendChild(btn);
    });

    // Listener no input (sem recriar DOM)
    const inp = document.getElementById('jogos-search-input');
    const clr = document.getElementById('jogos-clear-btn');
    inp.addEventListener('input', () => {
      jogosSearch = inp.value;
      clr.style.display = jogosSearch ? 'block' : 'none';
      atualizaFiltros();
      renderJogosCards();
    });
    clr.addEventListener('click', () => {
      jogosSearch = ''; inp.value = ''; clr.style.display = 'none';
      atualizaFiltros();
      renderJogosCards();
    });

    // Container de cards
    const cardsDiv = document.createElement('div');
    cardsDiv.id = 'jogos-cards';
    jogosEl.appendChild(cardsDiv);
  }

  // Sincroniza valor do input com estado
  const inp = document.getElementById('jogos-search-input');
  if(inp && inp.value !== jogosSearch) inp.value = jogosSearch;

  atualizaFiltros();
  renderJogosCards();
  return;
}

function atualizaFiltros() {
  const hasSearch = jogosSearch.trim().length > 0;
  // Atualiza classes active nos botões
  document.querySelectorAll('#filtros-scroll .filtro-btn, #filtro-todos').forEach(btn => {
    btn.classList.remove('active');
  });
  if(!hasSearch) {
    const activeId = jogosFiltroData ? 'filtro-' + jogosFiltroData : 'filtro-todos';
    const activeBtn = document.getElementById(activeId);
    if(activeBtn) {
      activeBtn.classList.add('active');
      // Scroll automático para a data ativa
      activeBtn.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
    }
  }
}

function renderJogosCards() {
  const cardsEl = document.getElementById('jogos-cards');
  if(!cardsEl) { renderJogos(); return; }
  const dates = [...new Set(GDATA.map(g=>g.data))].sort();
  const hasSearch = jogosSearch.trim().length > 0;
  const activeDate = hasSearch ? null : jogosFiltroData;
  let html = '';

  // ── Filtra jogos ──
  const filtered = GDATA.filter(g => {
    // Se há busca: ignora data, busca em todos os jogos
    if(hasSearch) {
      const q = jogosSearch.toLowerCase().trim();
      const numMatch = String(g.id) === q;
      const teamMatch = g.A.toLowerCase().includes(q) || g.B.toLowerCase().includes(q);
      // Normaliza para busca sem acento
      const normalize = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
      const normMatch = normalize(g.A).includes(normalize(q)) || normalize(g.B).includes(normalize(q));
      return numMatch || teamMatch || normMatch;
    }
    // Sem busca: filtra por data (ou todos)
    if(jogosFiltroData && g.data !== jogosFiltroData) return false;
    return true;
  });

  filtered.forEach(g => {
    const status = gameStatus(g);
    const res = getResult(g.id);
    const pA = res?.a??'—', pB = res?.b??'—';
    const isLive = status==='IN_PLAY'||status==='PAUSED';
    const isDone = status==='FINISHED';
    // Minuto calculado por jogo
    const gdtG = new Date(g.data+'T'+g.hora+':00-03:00');
    const liveMin = liveResults[g.id]?.minute || null;
    let calcMin = null;
    if(isLive) {
      const elapsedMin = Math.floor((new Date() - gdtG) / 60000);
      if(elapsedMin <= 45)       calcMin = Math.min(elapsedMin, 45);
      else if(elapsedMin <= 60)  calcMin = null;
      else if(elapsedMin <= 105) calcMin = Math.min(45 + (elapsedMin - 60), 90);
      else                       calcMin = elapsedMin - 60;
    }
    const minVal = liveMin || calcMin;
    const min = minVal ? minVal + "'" : '';
    const phase = res?.phase;

    const statusLabel = isLive
      ? `<span style="color:#e63946;font-weight:700;font-size:10px;display:flex;align-items:center;gap:3px"><span class="live-dot" style="width:6px;height:6px"></span>AO VIVO ${min}</span>`
      : isDone ? `<span style="color:var(--muted);font-size:10px">Encerrado</span>`
      : `<span style="color:var(--verde);font-size:10px">${g.hora}</span>`;

    html += `<div class="jogo-card">
      <div class="jogo-meta">
        <span>Jogo ${g.id} · ${g.fase}</span>
        <span>${fmtDateFull(g.data)}</span>
      </div>
      ${(()=>{ const v=ESPN_META['venue_bolao_'+g.id]; return v ? `<div style="background:rgba(0,39,118,.06);font-size:9px;color:var(--muted);padding:2px 12px;text-align:center">🏟️ ${v.name} · ${v.city}</div>` : ''; })()}
      <div class="jogo-body">
        <div class="jogo-confronto">
          <div class="time-bloco">
            ${(()=>{ const lg=getTeamLogo(g.A); return lg ? `<img style="width:32px;height:32px;object-fit:contain" src="${lg}" alt="${g.A}" onerror="this.style.display='none'">` : `<div class="time-flag-big">${getFlag(g.A)}</div>`; })()}
            <div class="time-nome-small">${g.A}</div>
            ${(()=>{ const f=getTeamForm(g.A); return f ? '<div class="form-dots">' + f.split('').map(c=>`<span class="form-dot form-${c}" title="${c==='W'?'Vitória':c==='D'?'Empate':'Derrota'}"></span>`).join('') + '</div>' : ''; })()}
          </div>
          <div class="placar-box">
            <div class="placar-num ${isLive||isDone&&res?'updated':''}">${pA}</div>
            <div class="placar-sep">×</div>
            <div class="placar-num ${isLive||isDone&&res?'updated':''}">${pB}</div>
          </div>
          <div class="time-bloco">
            ${(()=>{ const lg=getTeamLogo(g.B); return lg ? `<img style="width:32px;height:32px;object-fit:contain" src="${lg}" alt="${g.B}" onerror="this.style.display='none'">` : `<div class="time-flag-big">${getFlag(g.B)}</div>`; })()}
            <div class="time-nome-small">${g.B}</div>
            ${(()=>{ const f=getTeamForm(g.B); return f ? '<div class="form-dots">' + f.split('').map(c=>`<span class="form-dot form-${c}" title="${c==='W'?'Vitória':c==='D'?'Empate':'Derrota'}"></span>`).join('') + '</div>' : ''; })()}
          </div>
        </div>
        <div class="jogo-footer">
